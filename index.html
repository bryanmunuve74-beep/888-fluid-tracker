<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>8/8/8 Fluid RPG Tracker</title>

  <!-- PWA & MOBILE METADATA -->
  <meta name="theme-color" id="theme-color-meta" content="#f5f0e6">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="8/8/8 Tracker">
  <meta name="application-name" content="8/8/8 Tracker">

  <!-- EXTERNAL PWA MANIFEST -->
  <link rel="manifest" href="./manifest.json">

  <!-- EXTERNAL FONTS WITH SYSTEM OFFLINE FALLBACKS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      /* LIGHT MODE (Cream Palette: #F5F0E6) */
      --bg: #f5f0e6;
      --card-bg: #ffffff;
      --border-pixel: #dcd2c0;
      --text-main: #2d2820;
      --text-muted: #786e5e;
      --work: #2563eb;
      --personal: #db2777;
      --sleep: #7c3aed;
      --hp-color: #dc2626;
      --xp-color: #d97706;
      --rival-color: #9333ea;
      --shadow: #c8bead;
    }

    [data-theme="dark"] {
      --bg: #0d0f18;
      --card-bg: #161a29;
      --border-pixel: #2a3148;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --work: #3b82f6;
      --personal: #ec4899;
      --sleep: #8b5cf6;
      --hp-color: #ef4444;
      --xp-color: #eab308;
      --rival-color: #a855f7;
      --shadow: #000000;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 16px;
      transition: background-color 0.3s ease;
    }

    .retro-font { 
      font-family: 'Press Start 2P', "Courier New", Courier, monospace; 
      letter-spacing: -0.5px;
    }
    
    .container { width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: 16px; }

    /* TOP BAR & THEME TOGGLE */
    .top-bar { display: flex; justify-content: space-between; align-items: center; }
    .theme-btn {
      background: var(--card-bg);
      border: 2px solid var(--border-pixel);
      color: var(--text-main);
      padding: 8px 12px;
      font-size: 10px;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--shadow);
    }
    .theme-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--shadow); }

    /* RPG HUD */
    .rpg-dashboard {
      background: var(--card-bg);
      border: 3px solid var(--border-pixel);
      box-shadow: 0 6px 0 var(--shadow);
      padding: 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    @media (max-width: 550px) { .rpg-dashboard { grid-template-columns: 1fr; } }

    .hud-box { background: rgba(0,0,0,0.04); padding: 10px; border: 2px solid var(--border-pixel); }
    .bar-bg { height: 12px; background: rgba(0,0,0,0.15); border: 1px solid var(--border-pixel); margin-top: 4px; overflow: hidden; }
    .bar-fill { height: 100%; transition: width 0.3s ease; }

    /* 24-HOUR BALANCE BAR */
    .balance-card {
      background: var(--card-bg);
      border: 3px solid var(--border-pixel);
      box-shadow: 0 6px 0 var(--shadow);
      padding: 14px;
    }
    .multi-bar { height: 20px; background: rgba(0,0,0,0.1); display: flex; overflow: hidden; border: 2px solid var(--border-pixel); margin-top: 8px; }
    .seg-work { background: var(--work); transition: width 0.3s ease; }
    .seg-personal { background: var(--personal); transition: width 0.3s ease; }
    .seg-sleep { background: var(--sleep); transition: width 0.3s ease; }

    /* BUCKET CARDS */
    .bucket-card {
      background: var(--card-bg);
      border: 3px solid var(--border-pixel);
      box-shadow: 0 6px 0 var(--shadow);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .bucket-card.active { border-color: var(--text-main); }
    .time-val { font-size: 22px; font-weight: 800; font-family: monospace; }
    .target-val { font-size: 11px; color: var(--text-muted); font-weight: 700; text-align: right; }
    
    .btn-group { display: flex; gap: 6px; }
    button { cursor: pointer; border: 2px solid var(--border-pixel); font-family: inherit; font-weight: 700; }
    .btn-toggle { flex: 2; padding: 12px; color: white; background: var(--text-main); }
    .btn-adjust { flex: 1; padding: 12px; background: rgba(0,0,0,0.05); color: var(--text-main); font-size: 11px; }

    .history-card { background: var(--card-bg); border: 2px solid var(--border-pixel); padding: 10px; font-size: 11px; color: var(--text-muted); }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-bar">
      <span class="retro-font" style="font-size: 10px;" id="date-display">DATE: ----/--/--</span>
      <button class="theme-btn retro-font" onclick="toggleTheme()">TOGGLE THEME</button>
    </div>

    <!-- RPG HUD -->
    <div class="rpg-dashboard">
      <div class="hud-box">
        <div class="retro-font" style="font-size: 9px; color: var(--xp-color);">HERO (LVL <span id="lvl-val">1</span>)</div>
        <div class="bar-bg"><div id="xp-bar" class="bar-fill" style="width: 0%; background: var(--xp-color);"></div></div>
      </div>
      <div class="hud-box">
        <div class="retro-font" style="font-size: 9px; color: var(--rival-color);">SLOTH RIVAL</div>
        <div class="bar-bg"><div id="rival-bar" class="bar-fill" style="width: 0%; background: var(--rival-color);"></div></div>
      </div>
    </div>

    <!-- 24-HOUR TIME SPECTRUM -->
    <div class="balance-card">
      <div class="retro-font" style="font-size: 9px; display: flex; justify-content: space-between;">
        <span>24H SPECTRUM</span>
        <span id="unallocated-val">UNALLOCATED: 24.0h</span>
      </div>
      <div class="multi-bar">
        <div id="bar-work" class="seg-work" style="width: 0%;"></div>
        <div id="bar-personal" class="seg-personal" style="width: 0%;"></div>
        <div id="bar-sleep" class="seg-sleep" style="width: 0%;"></div>
      </div>
    </div>

    <!-- TRACKING BUCKETS -->
    <div class="bucket-card" id="card-work">
      <div style="display: flex; justify-content: space-between; align-items: flex-start;">
        <div>
          <span class="retro-font" style="font-size: 10px; color: var(--work);">💼 WORK & FOCUS</span>
          <div class="time-val" id="time-work">00:00:00</div>
        </div>
        <div class="target-val" id="target-work">0.0 / 8.0h</div>
      </div>
      <div class="btn-group">
        <button class="btn-toggle" style="background: var(--work);" onclick="toggleTimer('work')">START / PAUSE</button>
        <button class="btn-adjust" onclick="adjustTime('work', 1800)">+30m</button>
        <button class="btn-adjust" onclick="adjustTime('work', -900)">-15m</button>
      </div>
    </div>

    <div class="bucket-card" id="card-personal">
      <div style="display: flex; justify-content: space-between; align-items: flex-start;">
        <div>
          <span class="retro-font" style="font-size: 10px; color: var(--personal);">🌿 PERSONAL & REST</span>
          <div class="time-val" id="time-personal">00:00:00</div>
        </div>
        <div class="target-val" id="target-personal">0.0 / 8.0h</div>
      </div>
      <div class="btn-group">
        <button class="btn-toggle" style="background: var(--personal);" onclick="toggleTimer('personal')">START / PAUSE</button>
        <button class="btn-adjust" onclick="adjustTime('personal', 1800)">+30m</button>
        <button class="btn-adjust" onclick="adjustTime('personal', -900)">-15m</button>
      </div>
    </div>

    <div class="bucket-card" id="card-sleep">
      <div style="display: flex; justify-content: space-between; align-items: flex-start;">
        <div>
          <span class="retro-font" style="font-size: 10px; color: var(--sleep);">🌙 SLEEP</span>
          <div class="time-val" id="time-sleep">00:00:00</div>
        </div>
        <div class="target-val" id="target-sleep">0.0 / 8.0h</div>
      </div>
      <div class="btn-group">
        <button class="btn-toggle" style="background: var(--sleep);" onclick="toggleTimer('sleep')">START / PAUSE</button>
        <button class="btn-adjust" onclick="adjustTime('sleep', 1800)">+30m</button>
        <button class="btn-adjust" onclick="adjustTime('sleep', -900)">-15m</button>
      </div>
    </div>

    <div class="history-card" id="history-box">Yesterday: No log records found</div>
  </div>

  <script>
    // SERVICE WORKER REGISTRATION
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(registration => {
            console.log('Service worker registered:', registration.scope);
          })
          .catch(error => {
            console.error('Service worker registration failed:', error);
          });
      });
    }

    // APPLICATION LOGIC
    const DAY_SEC = 86400;

    function getLocalDateKey(d = new Date()) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    let appState = JSON.parse(localStorage.getItem('fluid_888_v06')) || {
      currentDate: getLocalDateKey(),
      theme: 'light',
      categories: {
        work: { accumulated: 0, adjustment: 0 },
        personal: { accumulated: 0, adjustment: 0 },
        sleep: { accumulated: 0, adjustment: 0 }
      },
      activeSession: null,
      history: {}
    };

    function processMidnightSplit() {
      const now = new Date();
      const todayKey = getLocalDateKey(now);

      if (appState.currentDate !== todayKey) {
        const oldKey = appState.currentDate;
        const midnightMs = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0, 0).getTime();

        if (appState.activeSession && appState.activeSession.startedAt < midnightMs) {
          const elapsedOld = Math.floor((midnightMs - appState.activeSession.startedAt) / 1000);
          const cat = appState.activeSession.category;
          appState.categories[cat].accumulated += Math.max(0, elapsedOld);
          appState.activeSession.startedAt = midnightMs;
        }

        const summary = {};
        ['work', 'personal', 'sleep'].forEach(cat => summary[cat] = getCategoryTotal(cat));
        appState.history[oldKey] = summary;

        appState.currentDate = todayKey;
        appState.categories = {
          work: { accumulated: 0, adjustment: 0 },
          personal: { accumulated: 0, adjustment: 0 },
          sleep: { accumulated: 0, adjustment: 0 }
        };
        saveState();
      }
    }

    function getCategoryTotal(cat) {
      const c = appState.categories[cat];
      let total = c.accumulated + c.adjustment;
      if (appState.activeSession && appState.activeSession.category === cat) {
        total += Math.floor((Date.now() - appState.activeSession.startedAt) / 1000);
      }
      return Math.max(0, total);
    }

    function formatTime(totalSec) {
      const h = Math.floor(totalSec / 3600).toString().padStart(2, '0');
      const m = Math.floor((totalSec % 3600) / 60).toString().padStart(2, '0');
      const s = (totalSec % 60).toString().padStart(2, '0');
      return `${h}:${m}:${s}`;
    }

    function updateUI() {
      processMidnightSplit();
      
      document.documentElement.setAttribute('data-theme', appState.theme);
      const metaTheme = document.getElementById('theme-color-meta');
      if (metaTheme) {
        metaTheme.setAttribute('content', appState.theme === 'light' ? '#f5f0e6' : '#0d0f18');
      }

      let totalTracked = 0;
      const totals = {};

      ['work', 'personal', 'sleep'].forEach(cat => {
        totals[cat] = getCategoryTotal(cat);
        totalTracked += totals[cat];
        
        document.getElementById(`time-${cat}`).innerText = formatTime(totals[cat]);
        document.getElementById(`target-${cat}`).innerText = `${(totals[cat] / 3600).toFixed(1)} / 8.0h`;
        
        const card = document.getElementById(`card-${cat}`);
        if (appState.activeSession && appState.activeSession.category === cat) {
          card.classList.add('active');
        } else {
          card.classList.remove('active');
        }
      });

      const scaleBase = Math.max(DAY_SEC, totalTracked);
      document.getElementById('bar-work').style.width = `${(totals.work / scaleBase) * 100}%`;
      document.getElementById('bar-personal').style.width = `${(totals.personal / scaleBase) * 100}%`;
      document.getElementById('bar-sleep').style.width = `${(totals.sleep / scaleBase) * 100}%`;
      
      const statusLabel = document.getElementById('unallocated-val');
      if (totalTracked <= DAY_SEC) {
        const unallocated = DAY_SEC - totalTracked;
        statusLabel.innerText = `UNALLOCATED: ${(unallocated / 3600).toFixed(1)}h`;
        statusLabel.style.color = 'inherit';
      } else {
        const overflow = totalTracked - DAY_SEC;
        statusLabel.innerText = `OVERTIME: +${(overflow / 3600).toFixed(1)}h`;
        statusLabel.style.color = 'var(--hp-color)';
      }

      document.getElementById('date-display').innerText = `DATE: ${appState.currentDate}`;

      const totalXp = Math.floor(totalTracked / 60);
      const level = Math.floor(totalXp / 100) + 1;
      document.getElementById('lvl-val').innerText = level;
      document.getElementById('xp-bar').style.width = `${totalXp % 100}%`;

      const unallocatedRatio = Math.max(0, (DAY_SEC - totalTracked) / DAY_SEC);
      document.getElementById('rival-bar').style.width = `${unallocatedRatio * 100}%`;

      const keys = Object.keys(appState.history).sort();
      if (keys.length > 0) {
        const last = keys[keys.length - 1];
        const h = appState.history[last];
        document.getElementById('history-box').innerText = 
          `Yesterday (${last}): Work ${(h.work/3600).toFixed(1)}h | Personal ${(h.personal/3600).toFixed(1)}h | Sleep ${(h.sleep/3600).toFixed(1)}h`;
      }
    }

    function toggleTimer(cat) {
      processMidnightSplit();
      if (appState.activeSession && appState.activeSession.category === cat) {
        appState.categories[cat].accumulated = getCategoryTotal(cat) - appState.categories[cat].adjustment;
        appState.activeSession = null;
      } else {
        if (appState.activeSession) {
          const prev = appState.activeSession.category;
          appState.categories[prev].accumulated = getCategoryTotal(prev) - appState.categories[prev].adjustment;
        }
        appState.activeSession = { category: cat, startedAt: Date.now() };
      }
      saveState();
      updateUI();
    }

    function adjustTime(cat, deltaSeconds) {
      processMidnightSplit();
      appState.categories[cat].adjustment += deltaSeconds;
      saveState();
      updateUI();
    }

    function toggleTheme() {
      appState.theme = appState.theme === 'light' ? 'dark' : 'light';
      saveState();
      updateUI();
    }

    function saveState() {
      localStorage.setItem('fluid_888_v06', JSON.stringify(appState));
    }

    setInterval(updateUI, 1000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) updateUI(); });
    updateUI();
  </script>
</body>
</html>
